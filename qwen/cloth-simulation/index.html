<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark light" />
  <title>Cloth Physics Sandbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230d1117'/%3E%3Cpath d='M25 25 Q50 45 75 25 L75 60 Q50 80 25 60 Z' fill='%2358a6ff'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-CxGVNSSJ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-66JMcWnC.css">
</head>
<body>
  <div id="app">
    <!-- WebGL canvas (the cloth itself is rendered here) -->
    <canvas id="gl"></canvas>

    <!-- Real-time performance overlay -->
    <div id="perf" class="perf" aria-live="off">
      <div class="perf-row"><span class="k">FPS</span><span id="perf-fps" class="v">--</span></div>
      <div class="perf-row"><span class="k">Physics</span><span id="perf-physics" class="v">--</span></div>
      <div class="perf-row"><span class="k">Particles</span><span id="perf-particles" class="v">--</span></div>
      <div class="perf-row"><span class="k">Constraints</span><span id="perf-constraints" class="v">--</span></div>
    </div>

    <!-- Interaction hint -->
    <div id="help" class="help">
      <span><b>Drag</b> cloth to pull it</span>
      <span><b>Right-drag</b> / empty drag to orbit</span>
      <span><b>Scroll</b> to zoom</span>
      <span>Switch to <b>Pin</b> mode to pin/unpin by tapping</span>
    </div>

    <!-- Mobile panel toggle -->
    <button id="panel-toggle" class="panel-toggle" aria-label="Toggle controls" title="Toggle controls">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
        <circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/>
      </svg>
    </button>

    <!-- Control panel (populated by src/ui/Controls.js) -->
    <aside id="panel" class="panel" aria-label="Simulation controls">
      <div class="panel-inner" id="panel-inner"></div>
    </aside>
  </div>

</body>
</html>
