<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dino Run — Sunset</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1a1626;
    overscroll-behavior: none;
    touch-action: none;
  }
  #c {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, dpr = 1;

  // ---------- tunables (recomputed on resize) ----------
  var groundY, dinoX, dinoStandH, dinoStandW, dinoDuckH, dinoDuckW;
  var g, jumpV, baseSpeed, maxSpeed;

  function recompute() {
    groundY = H * 0.82;
    dinoX = Math.max(90, W * 0.16);
    dinoStandH = H * 0.135;
    dinoStandW = H * 0.105;
    dinoDuckH = H * 0.075;
    dinoDuckW = H * 0.15;
    g = H * 3.4;
    jumpV = H * 1.08;
    baseSpeed = W * 0.35;
    maxSpeed = W * 0.85;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    recompute();
    if (state.mode !== 'running') state.dinoY = groundY;
  }
  window.addEventListener('resize', resize);

  // ---------- procedural hash (stable per tile index) ----------
  function ih(n) {
    n = (n << 13) ^ n;
    n = (n * (n * n * 15731 + 789221) + 1376312589) >>> 0;
    return n / 4294967296;
  }

  // ---------- state ----------
  var high = 0;
  try { high = parseInt(localStorage.getItem('dinoHigh') || '0', 10) || 0; } catch (e) {}

  var state = {
    mode: 'ready',       // ready | running | gameover
    distance: 0,
    speed: 0,
    score: 0,
    bonus: 0,
    high: high,
    dinoY: 0,
    vy: 0,
    onGround: true,
    ducking: false,
    lastGroundTime: 0,
    jumpBuffer: 0,
    shake: 0,
    shakeTime: 0,
    obstacles: [],
    nextObstacle: 0,
    dust: [],
    time: 0
  };

  function reset() {
    state.mode = 'running';
    state.distance = 0;
    state.speed = baseSpeed;
    state.score = 0;
    state.bonus = 0;
    state.dinoY = groundY;
    state.vy = 0;
    state.onGround = true;
    state.ducking = false;
    state.lastGroundTime = state.time;
    state.jumpBuffer = 0;
    state.shake = 0;
    state.shakeTime = 0;
    state.obstacles.length = 0;
    state.dust.length = 0;
    state.nextObstacle = W + 400;
  }

  // ---------- input ----------
  var keys = { up: false, down: false };

  function tryJump() {
    if (state.mode !== 'running') return;
    var coyote = (state.time - state.lastGroundTime) < 0.09;
    if (state.onGround || coyote) {
      state.vy = -jumpV;
      state.onGround = false;
      state.lastGroundTime = 0;
      state.jumpBuffer = 0;
      spawnDust(6);
    } else {
      state.jumpBuffer = 0.12;
    }
  }

  window.addEventListener('keydown', function (e) {
    var k = e.code;
    if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' ||
        k === 'ArrowRight' || k === 'Space' || k === 'Enter') {
      e.preventDefault();
    }
    if (e.repeat) return;

    if (state.mode === 'gameover') {
      if (k === 'Space' || k === 'Enter') reset();
      return;
    }
    if (state.mode === 'ready') {
      if (k === 'ArrowUp' || k === 'Space' || k === 'Enter') reset();
      return;
    }
    // running
    if (k === 'ArrowUp') { keys.up = true; tryJump(); }
    else if (k === 'Space') { tryJump(); }
    else if (k === 'ArrowDown') { keys.down = true; }
  });

  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowDown') keys.down = false;
    if (e.code === 'ArrowUp') keys.up = false;
  });

  // pointer: tap to start / restart (convenience)
  window.addEventListener('pointerdown', function () {
    if (state.mode === 'ready' || state.mode === 'gameover') reset();
  });

  // ---------- obstacles ----------
  function spawnObstacle(wx) {
    var r = ih(wx * 3 + 1);
    var diff = Math.min(1, state.score / 4000);
    var type;
    if (r < 0.5) type = 'hurdle';
    else if (r < 0.8) type = 'branch';
    else type = 'tall';
    if (diff > 0.4 && r < 0.35) type = 'branch';

    var o = { worldX: wx, sx: wx - state.distance, type: type, passed: false };
    if (type === 'hurdle') {
      o.w = H * (0.03 + ih(wx + 7) * 0.02);
      o.h = H * (0.05 + ih(wx + 13) * 0.03);
      o.bonus = 10;
    } else if (type === 'tall') {
      o.w = H * 0.045;
      o.h = H * (0.08 + ih(wx + 29) * 0.03);
      o.bonus = 15;
    } else { // branch (duck under)
      o.w = H * (0.09 + ih(wx + 3) * 0.05);
      o.gap = H * 0.085;
      o.solidH = H * 0.09;
      o.bonus = 20;
    }
    state.obstacles.push(o);
  }

  function oHitbox(o) {
    if (o.type === 'branch') {
      return { x: o.sx, y: groundY - o.gap - o.solidH, w: o.w, h: o.solidH };
    }
    return { x: o.sx, y: groundY - o.h, w: o.w, h: o.h };
  }

  function dinoHitbox() {
    var h = state.ducking ? dinoDuckH : dinoStandH;
    var w = state.ducking ? dinoDuckW : dinoStandW;
    return {
      x: dinoX + w * 0.18,
      y: state.dinoY - h + h * 0.12,
      w: w * 0.64,
      h: h * 0.8
    };
  }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function updateObstacles() {
    // spawn ahead of the right edge
    while (state.nextObstacle < state.distance + W) {
      spawnObstacle(state.nextObstacle);
      var minT = Math.max(0.9, 1.7 - state.score * 0.0008);
      var extra = 0.4 + ih(state.nextObstacle) * 0.5;
      state.nextObstacle += state.speed * (minT + extra);
    }
    var dh = dinoHitbox();
    for (var i = state.obstacles.length - 1; i >= 0; i--) {
      var o = state.obstacles[i];
      o.sx = o.worldX - state.distance;
      if (o.sx + o.w < -60) { state.obstacles.splice(i, 1); continue; }
      if (!o.passed && o.sx + o.w < dinoX) {
        o.passed = true;
        state.bonus += o.bonus;
      }
      if (aabb(dh, oHitbox(o))) {
        gameOver();
        return;
      }
    }
  }

  function gameOver() {
    state.mode = 'gameover';
    state.shake = 1;
    state.shakeTime = 0.5;
    if (state.score > state.high) {
      state.high = state.score;
      try { localStorage.setItem('dinoHigh', String(state.high)); } catch (e) {}
    }
    spawnDust(22);
  }

  // ---------- dust ----------
  function spawnDust(n) {
    for (var i = 0; i < n; i++) {
      state.dust.push({
        x: dinoX + Math.random() * dinoStandW,
        y: groundY,
        vx: -50 - Math.random() * 100,
        vy: -20 - Math.random() * 60,
        life: 0.4 + Math.random() * 0.4,
        max: 0.8,
        r: 2 + Math.random() * 4
      });
    }
  }

  function updateFx(dt) {
    if (state.shakeTime > 0) state.shakeTime -= dt;
    for (var i = state.dust.length - 1; i >= 0; i--) {
      var p = state.dust[i];
      p.life -= dt;
      if (p.life <= 0) { state.dust.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
    }
    if (state.mode === 'running' && state.onGround && Math.random() < 0.3) {
      state.dust.push({
        x: dinoX + Math.random() * dinoStandW * 0.5,
        y: groundY,
        vx: -40 - Math.random() * 40,
        vy: -10 - Math.random() * 20,
        life: 0.3 + Math.random() * 0.3,
        max: 0.6,
        r: 1 + Math.random() * 2
      });
    }
  }

  // ---------- update ----------
  function update(dt) {
    state.time += dt;
    updateFx(dt);
    if (state.mode !== 'running') {
      state.dinoY = groundY;
      state.vy = 0;
      return;
    }

    // speed ramp (acceleration toward target)
    var target = Math.min(maxSpeed, baseSpeed + state.score * 0.4);
    state.speed += (target - state.speed) * Math.min(1, dt * 1.5);
    state.distance += state.speed * dt;
    state.score = Math.floor(state.distance / 40) + state.bonus;

    // dino physics
    state.ducking = keys.down;
    var fastFall = keys.down && !state.onGround;
    var grav = g * (fastFall ? 1.9 : 1);
    state.vy += grav * dt;
    state.dinoY += state.vy * dt;

    if (state.dinoY >= groundY) {
      if (!state.onGround) {
        state.onGround = true;
        state.dinoY = groundY;
        state.vy = 0;
        state.lastGroundTime = state.time;
        spawnDust(8);
        if (state.jumpBuffer > 0) tryJump();
      } else {
        state.dinoY = groundY;
        state.vy = 0;
      }
    } else {
      state.onGround = false;
    }
    if (state.jumpBuffer > 0) state.jumpBuffer -= dt;

    updateObstacles();
  }

  // ---------- drawing helpers ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Generic tiling layer. scroll = distance * f; as scroll grows, sx shrinks => moves LEFT.
  function tileLayer(f, T, drawTile) {
    var scroll = state.distance * f;
    var first = Math.floor(scroll / T) - 1;
    var count = Math.ceil(W / T) + 3;
    for (var i = first; i < first + count; i++) {
      var sx = i * T - scroll;
      drawTile(sx, i);
    }
  }

  // ---------- background layers ----------
  function drawSky() {
    var grd = ctx.createLinearGradient(0, 0, 0, groundY);
    grd.addColorStop(0, '#241f47');
    grd.addColorStop(0.35, '#5b3f6b');
    grd.addColorStop(0.6, '#b5543f');
    grd.addColorStop(0.82, '#e88a4e');
    grd.addColorStop(1, '#f7c489');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, groundY + 2);

    var sx = W * 0.72, sy = groundY * 0.6, sr = H * 0.11;
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 3);
    glow.addColorStop(0, 'rgba(255,236,180,0.9)');
    glow.addColorStop(0.3, 'rgba(255,200,120,0.5)');
    glow.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, groundY);
    ctx.fillStyle = '#ffe7ad';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, 7);
    ctx.fill();
  }

  function drawCloud(x, y, s, a) {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f7d9b0';
    ctx.beginPath();
    ctx.ellipse(x, y, s * 2.2, s, 0, 0, 7);
    ctx.ellipse(x + s * 1.4, y + s * 0.2, s * 1.6, s * 0.8, 0, 0, 7);
    ctx.ellipse(x - s * 1.4, y + s * 0.2, s * 1.5, s * 0.7, 0, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  function drawClouds() {
    tileLayer(0.08, W * 0.6, function (sx, i) {
      var cy = H * (0.1 + ih(i * 5 + 1) * 0.24);
      var cs = H * (0.03 + ih(i * 7 + 2) * 0.05);
      var a = 0.2 + ih(i * 3) * 0.3;
      drawCloud(sx + ih(i * 9) * W * 0.6, cy, cs, a);
    });
  }

  function drawMountains() {
    for (var layer = 0; layer < 2; layer++) {
      var f2 = 0.13 + layer * 0.05;
      var T2 = W * (0.5 - layer * 0.12);
      var col = layer === 0 ? 'rgba(125,100,150,0.5)' : 'rgba(88,66,112,0.72)';
      var maxPeak = H * (0.22 - layer * 0.05);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      tileLayer(f2, T2, function (sx, i) {
        var peak = groundY - H * (0.05 + ih(i * 13 + layer * 7 + 1) * maxPeak);
        ctx.lineTo(sx, groundY);
        ctx.lineTo(sx + T2 * 0.5, peak);
        ctx.lineTo(sx + T2, groundY);
      });
      ctx.lineTo(W, groundY);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBird(x, y, s, flap) {
    ctx.strokeStyle = 'rgba(45,38,60,0.85)';
    ctx.lineWidth = Math.max(1.2, s * 0.6);
    ctx.lineCap = 'round';
    var wy = flap * s;
    ctx.beginPath();
    ctx.moveTo(x - s * 2.2, y - wy);
    ctx.quadraticCurveTo(x - s * 0.8, y + s * 0.5, x, y);
    ctx.quadraticCurveTo(x + s * 0.8, y + s * 0.5, x + s * 2.2, y - wy);
    ctx.stroke();
  }

  function drawBirds() {
    tileLayer(0.30, W * 0.35, function (sx, i) {
      if (ih(i * 17 + 5) < 0.45) return;
      var bx = sx + ih(i * 3) * W * 0.35 * 0.5;
      var by = H * (0.15 + ih(i * 7) * 0.2);
      var s = H * (0.006 + ih(i * 11) * 0.006);
      var flap = Math.sin(state.time * 6 + i) * 0.6;
      drawBird(bx, by, s, flap);
    });
  }

  function drawHills() {
    tileLayer(0.45, W * 0.4, function (sx, i) {
      var hw = W * 0.4 * (0.7 + ih(i * 5) * 0.6);
      var hh = H * (0.05 + ih(i * 9) * 0.09);
      ctx.fillStyle = 'rgba(122,96,58,' + (0.5 + ih(i) * 0.3) + ')';
      ctx.beginPath();
      ctx.ellipse(sx + W * 0.2, groundY, hw, hh, 0, Math.PI, 2 * Math.PI);
      ctx.fill();
    });
  }

  function drawTree(x, baseY, h, type) {
    var trunkW = h * 0.12;
    ctx.fillStyle = '#3a2f26';
    ctx.fillRect(x - trunkW / 2, baseY - h * 0.5, trunkW, h * 0.5);
    if (type === 'pine') {
      ctx.fillStyle = '#2f4a30';
      for (var k = 0; k < 3; k++) {
        var ly = baseY - h * 0.45 - k * h * 0.22;
        var lw = h * (0.5 - k * 0.12);
        ctx.beginPath();
        ctx.moveTo(x - lw, ly);
        ctx.lineTo(x, ly - h * 0.35);
        ctx.lineTo(x + lw, ly);
        ctx.closePath();
        ctx.fill();
      }
    } else {
      ctx.fillStyle = '#3a5a34';
      ctx.beginPath();
      ctx.arc(x, baseY - h * 0.65, h * 0.4, 0, 7);
      ctx.fill();
    }
  }

  function drawTrees() {
    tileLayer(0.55, W * 0.28, function (sx, i) {
      if (ih(i * 31 + 4) < 0.3) return;
      var tx = sx + ih(i * 3) * W * 0.28 * 0.6;
      var th = H * (0.06 + ih(i * 7) * 0.08);
      drawTree(tx, groundY, th, ih(i * 11) > 0.5 ? 'pine' : 'round');
    });
  }

  function drawRock(x, y, s) {
    ctx.fillStyle = '#6a5a4a';
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.lineTo(x - s * 0.5, y - s);
    ctx.lineTo(x + s * 0.4, y - s * 0.9);
    ctx.lineTo(x + s, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.5, y - s);
    ctx.lineTo(x + s * 0.4, y - s * 0.9);
    ctx.lineTo(x + s * 0.1, y - s * 0.4);
    ctx.closePath();
    ctx.fill();
  }

  function drawBush(x, y, s) {
    ctx.fillStyle = '#4a5a34';
    ctx.beginPath();
    ctx.arc(x - s * 0.5, y - s * 0.4, s * 0.6, 0, 7);
    ctx.arc(x + s * 0.5, y - s * 0.4, s * 0.6, 0, 7);
    ctx.arc(x, y - s * 0.7, s * 0.7, 0, 7);
    ctx.fill();
  }

  function drawGrassTuft(x, y, s) {
    ctx.strokeStyle = '#6a7a3a';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + k * s * 0.3, y - s * 0.6, x + k * s * 0.5, y - s);
      ctx.stroke();
    }
  }

  function drawRoadside() {
    tileLayer(0.8, W * 0.22, function (sx, i) {
      var r = ih(i * 41 + 6);
      var rx = sx + ih(i * 3) * W * 0.22 * 0.7;
      var s = H * (0.02 + ih(i * 7) * 0.03);
      if (r < 0.4) drawRock(rx, groundY, s);
      else if (r < 0.75) drawBush(rx, groundY, s);
      else drawGrassTuft(rx, groundY, s);
    });
  }

  function drawGround() {
    var grd = ctx.createLinearGradient(0, groundY, 0, H);
    grd.addColorStop(0, '#8a6a44');
    grd.addColorStop(0.15, '#a5825a');
    grd.addColorStop(1, '#6a4f34');
    ctx.fillStyle = grd;
    ctx.fillRect(0, groundY, W, H - groundY);

    // grass edge
    ctx.fillStyle = '#5a6a34';
    ctx.fillRect(0, groundY - 2, W, 4);

    // lighter run band
    ctx.fillStyle = 'rgba(230,200,150,0.15)';
    ctx.fillRect(0, groundY + (H - groundY) * 0.1, W, (H - groundY) * 0.35);

    // scrolling dashes
    var dashT = W * 0.12;
    ctx.fillStyle = 'rgba(240,220,180,0.25)';
    tileLayer(1.0, dashT, function (sx, i) {
      ctx.fillRect(sx, groundY + (H - groundY) * 0.28, dashT * 0.5, 3);
    });

    // pebbles + grass blades
    tileLayer(1.0, W * 0.16, function (sx, i) {
      var r = ih(i * 53 + 8);
      var px = sx + ih(i * 3) * W * 0.16 * 0.8;
      var py = groundY + (H - groundY) * (0.15 + ih(i * 7) * 0.7);
      if (r < 0.5) {
        ctx.fillStyle = 'rgba(90,70,50,' + (0.4 + ih(i) * 0.4) + ')';
        ctx.beginPath();
        ctx.ellipse(px, py, 3 + ih(i * 5) * 5, 2 + ih(i * 9) * 3, 0, 0, 7);
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(90,110,60,' + (0.5 + ih(i) * 0.4) + ')';
        ctx.lineWidth = 1.5;
        var gh = 4 + ih(i * 11) * 8;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px - 2, py - gh);
        ctx.moveTo(px, py);
        ctx.lineTo(px + 2, py - gh * 0.8);
        ctx.stroke();
      }
    });
  }

  function drawShadows() {
    var airH = groundY - state.dinoY;
    var shScale = Math.max(0.4, 1 - airH / (H * 0.3));
    var dw = state.ducking ? dinoDuckW : dinoStandW;
    ctx.fillStyle = 'rgba(30,20,15,0.25)';
    ctx.beginPath();
    ctx.ellipse(dinoX + dw / 2, groundY + 6, dw * 0.5 * shScale, 6 * shScale, 0, 0, 7);
    ctx.fill();

    for (var i = 0; i < state.obstacles.length; i++) {
      var o = state.obstacles[i];
      if (o.sx > W || o.sx + o.w < 0) continue;
      if (o.type === 'branch') continue;
      ctx.fillStyle = 'rgba(30,20,15,0.2)';
      ctx.beginPath();
      ctx.ellipse(o.sx + o.w / 2, groundY + 6, o.w * 0.6, 5, 0, 0, 7);
      ctx.fill();
    }
  }

  // ---------- obstacles ----------
  function drawHurdle(o) {
    var x = o.sx, y = groundY - o.h, w = o.w, h = o.h;
    ctx.fillStyle = '#4a6a3a';
    roundRect(x, y, w, h, w * 0.3);
    ctx.fill();
    // arms
    roundRect(x - w * 0.45, y + h * 0.3, w * 0.55, h * 0.16, h * 0.08);
    ctx.fill();
    roundRect(x + w - w * 0.1, y + h * 0.45, w * 0.55, h * 0.16, h * 0.08);
    ctx.fill();
    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x + w * 0.2, y, w * 0.18, h);
  }

  function drawTall(o) {
    var x = o.sx, y = groundY - o.h, w = o.w, h = o.h;
    ctx.fillStyle = '#7a6a58';
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x + w * 0.15, y + h * 0.3);
    ctx.lineTo(x + w * 0.5, y);
    ctx.lineTo(x + w * 0.85, y + h * 0.25);
    ctx.lineTo(x + w, groundY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.5, y);
    ctx.lineTo(x + w * 0.85, y + h * 0.25);
    ctx.lineTo(x + w * 0.6, y + h * 0.5);
    ctx.lineTo(x + w * 0.4, y + h * 0.35);
    ctx.closePath();
    ctx.fill();
  }

  function drawBranch(o) {
    var gap = o.gap, solidH = o.solidH;
    var yTop = groundY - gap - solidH;
    var x = o.sx, w = o.w;
    ctx.strokeStyle = '#6a4a34';
    ctx.lineWidth = solidH * 0.35;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + w, yTop + solidH * 0.5);
    ctx.lineTo(x, yTop + solidH * 0.5);
    ctx.stroke();
    ctx.fillStyle = '#4a6a34';
    for (var k = 0; k < 5; k++) {
      var lx = x + (k + 0.5) / 5 * w;
      var ly = yTop + solidH * 0.5;
      var ls = solidH * (0.5 + ih(o.worldX + k) * 0.4);
      ctx.beginPath();
      ctx.ellipse(lx, ly, ls, ls * 0.6, 0, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = '#3f5f2e';
    for (var j = 0; j < 4; j++) {
      var lx2 = x + (j + 0.5) / 4 * w;
      var ly2 = yTop + solidH * 0.8;
      var ls2 = solidH * 0.4;
      ctx.beginPath();
      ctx.ellipse(lx2, ly2, ls2, ls2 * 0.5, 0, 0, 7);
      ctx.fill();
    }
  }

  function drawObstacles() {
    for (var i = 0; i < state.obstacles.length; i++) {
      var o = state.obstacles[i];
      if (o.sx > W + 60 || o.sx + o.w < -60) continue;
      if (o.type === 'hurdle') drawHurdle(o);
      else if (o.type === 'tall') drawTall(o);
      else drawBranch(o);
    }
  }

  // ---------- dino ----------
  function drawLegs(x, feetY, w, h, phase) {
    var hipY = feetY - h * 0.5;
    var hipX1 = x + w * 0.35;
    var hipX2 = x + w * 0.6;
    var legLen = h * 0.5;
    var swing = Math.sin(phase);
    var swing2 = Math.sin(phase + Math.PI);
    var air = !state.onGround;
    ctx.strokeStyle = '#2c323e';
    ctx.lineWidth = h * 0.14;
    ctx.lineCap = 'round';

    var f1x = hipX1 + swing * legLen * 0.5;
    var f1y = feetY;
    if (air) { f1x = hipX1 + legLen * 0.2; f1y = feetY - legLen * 0.3; }
    ctx.beginPath(); ctx.moveTo(hipX1, hipY); ctx.lineTo(f1x, f1y); ctx.stroke();
    ctx.fillStyle = '#2c323e';
    ctx.beginPath(); ctx.ellipse(f1x, f1y, h * 0.09, h * 0.05, 0, 0, 7); ctx.fill();

    var f2x = hipX2 + swing2 * legLen * 0.5;
    var f2y = feetY;
    if (air) { f2x = hipX2 - legLen * 0.1; f2y = feetY - legLen * 0.4; }
    ctx.beginPath(); ctx.moveTo(hipX2, hipY); ctx.lineTo(f2x, f2y); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(f2x, f2y, h * 0.09, h * 0.05, 0, 0, 7); ctx.fill();
  }

  function drawDino() {
    var duck = state.ducking;
    var air = !state.onGround;
    var h = duck ? dinoDuckH : dinoStandH;
    var w = duck ? dinoDuckW : dinoStandW;
    var x = dinoX;
    var feetY = state.dinoY;
    var phase = state.distance * 0.03;
    var bob = (air ? 0 : Math.sin(phase * 2) * h * 0.03);
    var bodyY = feetY - h + bob;

    var bodyCol = '#333a47';
    var bellyCol = '#59637a';
    var headCol = '#3a4250';

    ctx.save();
    if (duck) {
      // long low crouch
      roundRect(x, feetY - h, w, h * 0.7, h * 0.3);
      ctx.fillStyle = bodyCol; ctx.fill();
      // head forward + lower
      var hx = x + w * 0.78, hy = feetY - h * 0.95;
      roundRect(hx, hy, w * 0.35, h * 0.5, h * 0.2);
      ctx.fillStyle = headCol; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hx + w * 0.22, hy + h * 0.18, h * 0.09, 0, 7); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(hx + w * 0.24, hy + h * 0.18, h * 0.045, 0, 7); ctx.fill();
      drawLegs(x, feetY, w, h, phase);
      // tail
      ctx.fillStyle = bodyCol;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.1, feetY - h * 0.5);
      ctx.quadraticCurveTo(x - w * 0.4, feetY - h * 0.6, x - w * 0.5, feetY - h * 0.3);
      ctx.quadraticCurveTo(x - w * 0.1, feetY - h * 0.2, x + w * 0.1, feetY - h * 0.2);
      ctx.closePath(); ctx.fill();
    } else {
      // tail (back)
      ctx.fillStyle = bodyCol;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.1, bodyY + h * 0.5);
      ctx.quadraticCurveTo(x - w * 0.5, bodyY + h * 0.3, x - w * 0.6, bodyY + h * 0.05);
      ctx.quadraticCurveTo(x - w * 0.2, bodyY + h * 0.5, x + w * 0.1, bodyY + h * 0.72);
      ctx.closePath(); ctx.fill();
      // body
      roundRect(x, bodyY + h * 0.15, w, h * 0.55, w * 0.3);
      ctx.fillStyle = bodyCol; ctx.fill();
      // belly
      roundRect(x + w * 0.1, bodyY + h * 0.45, w * 0.7, h * 0.3, w * 0.2);
      ctx.fillStyle = bellyCol; ctx.fill();
      // spine bumps
      ctx.fillStyle = 'rgba(255,220,160,0.25)';
      for (var b = 0; b < 4; b++) {
        ctx.beginPath();
        ctx.arc(x + w * (0.2 + b * 0.18), bodyY + h * 0.16, w * 0.05, 0, 7);
        ctx.fill();
      }
      // head (front, up)
      var hx = x + w * 0.7, hy = bodyY - h * 0.05;
      roundRect(hx, hy, w * 0.5, h * 0.4, w * 0.18);
      ctx.fillStyle = headCol; ctx.fill();
      roundRect(hx + w * 0.3, hy + h * 0.12, w * 0.28, h * 0.22, w * 0.1);
      ctx.fillStyle = headCol; ctx.fill();
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hx + w * 0.28, hy + h * 0.14, h * 0.08, 0, 7); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(hx + w * 0.3, hy + h * 0.14, h * 0.04, 0, 7); ctx.fill();
      // arm
      ctx.fillStyle = bodyCol;
      ctx.fillRect(hx + w * 0.1, bodyY + h * 0.5, w * 0.12, h * 0.18);
      // legs
      drawLegs(x, feetY, w, h, phase);
    }
    ctx.restore();
  }

  function drawDust() {
    for (var i = 0; i < state.dust.length; i++) {
      var p = state.dust[i];
      var a = Math.max(0, p.life / p.max) * 0.5;
      ctx.fillStyle = 'rgba(200,180,150,' + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  }

  // ---------- UI ----------
  function centerText(t, y, size) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + Math.floor(size) + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillText(t, W / 2, y);
    ctx.shadowBlur = 0;
  }

  function drawUI() {
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.font = 'bold ' + Math.floor(H * 0.045) + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8;
    var s = String(state.score);
    while (s.length < 5) s = '0' + s;
    ctx.fillText(s, W - 24, 24);
    ctx.font = 'bold ' + Math.floor(H * 0.022) + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    var hs = String(state.high);
    while (hs.length < 5) hs = '0' + hs;
    ctx.fillText('HI ' + hs, W - 24, 24 + H * 0.05);
    ctx.shadowBlur = 0;

    if (state.mode === 'ready') {
      centerText('DINO RUN', H * 0.35, H * 0.07);
      centerText('Press  SPACE / UP  to start', H * 0.45, H * 0.03);
      centerText('UP = jump    DOWN = duck', H * 0.5, H * 0.025);
    } else if (state.mode === 'gameover') {
      centerText('GAME OVER', H * 0.38, H * 0.07);
      centerText('Score ' + state.score, H * 0.48, H * 0.035);
      centerText('Press SPACE or ENTER to restart', H * 0.55, H * 0.028);
    }
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(20,10,30,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- render ----------
  function render() {
    ctx.clearRect(0, 0, W, H);
    var shx = 0, shy = 0;
    if (state.shakeTime > 0) {
      var m = state.shake * (state.shakeTime / 0.5) * 8;
      shx = (Math.random() * 2 - 1) * m;
      shy = (Math.random() * 2 - 1) * m;
    }
    ctx.save();
    ctx.translate(shx, shy);
    drawSky();
    drawClouds();
    drawMountains();
    drawBirds();
    drawHills();
    drawTrees();
    drawRoadside();
    drawGround();
    drawShadows();
    drawObstacles();
    drawDino();
    drawDust();
    ctx.restore();
    drawUI();
    drawVignette();
  }

  // ---------- main loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  state.dinoY = groundY;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
